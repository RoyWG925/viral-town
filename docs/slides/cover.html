<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>VIRAL cover</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .scrim { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,14,20,.9) 0%, rgba(10,14,20,.78) 40%, rgba(10,14,20,0) 64%); backdrop-filter: blur(6px); -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 44%, transparent 62%); mask-image: linear-gradient(90deg, #000 0%, #000 44%, transparent 62%); }
  .text { position: absolute; left: 110px; top: 300px; color: #fff; max-width: 900px; }
  .kicker { font-size: 26px; letter-spacing: .28em; text-transform: uppercase; color: #ffb36b; font-weight: 800; }
  h1 { font-family: Georgia, serif; font-size: 190px; margin: 6px 0 0; line-height: 1; letter-spacing: .02em; }
  .tag { font-size: 54px; margin-top: 22px; font-family: Georgia, serif; }
  .sub { font-size: 30px; margin-top: 34px; color: #e5e7eb; line-height: 1.4; }
  .bubble { display: inline-block; margin-top: 44px; background: #fff; color: #1f2933; border-radius: 999px; padding: 16px 30px; font-size: 30px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
</style>
</head>
<body>
  <img src="shots/town.png" alt="" />
  <div class="scrim"></div>
  <div class="text">
    <div class="kicker">Gemma on AMD · Track 4</div>
    <h1>VIRAL</h1>
    <div class="tag">One whisper. A whole town reacts.</div>
    <div class="sub">Eight AI residents turn one sentence into an evening nobody scripted.</div>
    <div class="bubble">💬 “Psst… did you hear?”</div>
  </div>
</body>
</html>
